<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="3D精算器">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#13151a">
    <link rel="apple-touch-icon" href="https://gcore.jsdelivr.net/gh/cdn-icons/png-anime/512/mathematics-girl.png">
    <link rel="icon" type="image/png" href="https://gcore.jsdelivr.net/gh/cdn-icons/png-anime/512/mathematics-girl.png">
    <title>3D 双轨精算器</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Noto+Sans+SC:wght@400;500;700&display=swap');
        :root{
            --bg:#13151a;--s1:#1a1d24;--s2:#1f232c;--s3:#252a34;
            --b1:#2a3040;--b2:#323a4a;
            --cy:#4fc3f7;--cy2:rgba(79,195,247,.12);
            --am:#ffa040;--am2:rgba(255,160,64,.12);
            --rd:#ef5350;--rd2:rgba(239,83,80,.12);
            --gn:#66bb6a;--pu:#ab8fdf;
            --t1:#dde3ee;--t2:#8896aa;--t3:#4a5568;--t4:#2d3748;
            --mono:'JetBrains Mono',monospace;--sans:'Noto Sans SC',sans-serif;--r:9px;
        }
        *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
        html,body{background:var(--bg);color:var(--t1);font-family:var(--sans);min-height:100vh;-webkit-font-smoothing:antialiased}
        .app{max-width:430px;margin:0 auto;padding-bottom:64px}
        .hdr{padding:16px 16px 12px;border-bottom:1px solid var(--b1)}
        .hdr-row{display:flex;justify-content:space-between;align-items:flex-end}
        .hdr-title{font-size:17px;font-weight:700;color:#fff;letter-spacing:.3px}
        .hdr-title em{color:var(--cy);font-style:normal}
        .hdr-sub{font-family:var(--mono);font-size:9px;color:var(--t3);letter-spacing:1.5px;margin-top:3px}
        .hdr-ep{font-family:var(--mono);font-size:11px;color:var(--t2);padding:3px 8px;background:var(--s2);border:1px solid var(--b1);border-radius:5px}
        .tabs{display:flex;background:var(--s1);border-bottom:1px solid var(--b1)}
        .tab{flex:1;padding:11px 0;background:none;border:none;border-bottom:2px solid transparent;color:var(--t3);font-size:13px;font-weight:700;font-family:var(--sans);cursor:pointer;transition:.15s}
        .tab.on{color:var(--cy);border-bottom-color:var(--cy);background:var(--s2)}
        .pg{padding:14px 14px}
        .sec{font-family:var(--mono);font-size:9px;color:var(--t3);letter-spacing:2px;text-transform:uppercase;margin:14px 0 8px;display:flex;align-items:center;gap:8px}
        .sec:first-child{margin-top:0}.sec::after{content:'';flex:1;height:1px;background:var(--b1)}
        .card{background:var(--s1);border:1px solid var(--b1);border-radius:var(--r);padding:13px;margin-bottom:10px}
        .lbl{font-size:11px;color:var(--t2);display:block;margin-bottom:5px}
        .inp{background:var(--bg);border:1px solid var(--b2);border-radius:7px;color:var(--t1);font-family:var(--mono);font-size:15px;padding:9px 12px;width:100%;outline:none;letter-spacing:1.5px;transition:.15s}
        .inp:focus{border-color:var(--cy);box-shadow:0 0 0 2px var(--cy2)}
        .dig-hd{display:flex;gap:6px;margin-bottom:5px}.dig-hd span{flex:1;text-align:center;font-size:10px;color:var(--t3)}
        .dig-row{display:flex;gap:6px}.dig{flex:1;background:var(--bg);border:1px solid var(--b2);border-radius:7px;color:var(--t1);font-family:var(--mono);font-size:24px;padding:9px 2px;text-align:center;outline:none;transition:.15s;min-width:0;font-weight:600}
        .dig:focus{border-color:var(--cy);box-shadow:0 0 0 2px var(--cy2)}
        .btn{display:block;width:100%;padding:12px;margin-top:10px;border:none;border-radius:var(--r);font-size:14px;font-weight:700;cursor:pointer;letter-spacing:.3px;transition:.12s;font-family:var(--sans)}
        .btn:active{transform:scale(.97);opacity:.88}.btn-cy{background:var(--cy);color:#0a0f18}.btn-ghost{background:var(--s2);color:var(--t2);border:1px solid var(--b2);font-size:13px}
        .bnr{border-radius:var(--r);padding:10px 13px;margin-bottom:10px;font-size:12px;line-height:1.65}
        .bnr-info{background:var(--s2);border:1px solid var(--b1);color:var(--t2)}.bnr-am{background:var(--am2);border:1px solid rgba(255,160,64,.25);color:var(--am)}
        .ticket{background:var(--s1);border:1px solid var(--b1);border-radius:var(--r);overflow:hidden;margin-bottom:10px}
        .tkt-hdr{display:flex;align-items:center;justify-content:space-between;padding:9px 13px;background:var(--s2);border-bottom:1px solid var(--b1)}
        .tkt-mod{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:1.5px}.tm-a{color:var(--am)}.tm-b{color:var(--pu)}
        .tkt-body{padding:4px 13px}
        .bet{display:grid;grid-template-columns:90px 1fr;align-items:center;gap:10px;padding:7px 0;border-bottom:1px dashed var(--b1)}
        .bet-n{font-family:var(--mono);font-size:22px;font-weight:600;color:#fff;letter-spacing:5px}
        .mb-row{display:grid;grid-template-columns:1fr 1fr;gap:5px;align-items:center;padding:8px 10px;border-top:1px solid var(--b1)}
        .mb-row:nth-child(5){border-bottom:3px solid #000}
        .mb-cell{background:var(--s2);border-radius:6px;border:1px solid var(--b1);padding:7px 6px}
        .mb-num{font-family:var(--mono);font-size:18px;font-weight:600;color:#fff;letter-spacing:3px;text-align:center}
        .cf{display:flex;align-items:center;gap:12px;padding:14px 13px;background:var(--s1);border:1px solid var(--b1);border-radius:var(--r);margin-bottom:10px}
        .tw{overflow-x:auto;border:1px solid var(--b1);border-radius:var(--r);background:var(--s1)}
        table{width:100%;border-collapse:collapse;min-width:340px}
        th{font-family:var(--mono);font-size:9px;color:var(--t3);padding:8px 10px;text-align:left;border-bottom:1px solid var(--b1);background:var(--s2)}
        td{padding:9px 10px;border-bottom:1px solid var(--b1);font-size:11px}
        .tc{font-family:var(--mono);color:var(--cy);font-weight:600}
        .tnum{font-family:var(--mono);font-size:13px;color:#fff;letter-spacing:2px;font-weight:600}
        .thit{color:var(--gn);font-weight:700}.tmiss{color:var(--rd)}
